apiVersion: apps/v1
kind: Deployment
metadata:
  name: itsm-service
  namespace: task-management
spec:
  replicas: 2
  selector:
    matchLabels:
      app: itsm-service
  template:
    metadata:
      labels:
        app: itsm-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8090"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
      - name: itsm-service
        image: task-management/itsm-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8090
          name: http
        env:
        - name: ITSM_HTTP_PORT
          value: "8090"
        envFrom:
        - configMapRef:
            name: app-config
        - secretRef:
            name: app-secrets
        livenessProbe:
          httpGet:
            path: /health
            port: 8090
          initialDelaySeconds: 20
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8090
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: itsm-service
  namespace: task-management
spec:
  selector:
    app: itsm-service
  ports:
  - port: 8090
    targetPort: 8090
    name: http
  type: ClusterIP
