apiVersion: v1
kind: Namespace
metadata:
  name: task-management
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: task-management
data:
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_USER: "postgres"
  DB_NAME: "taskmanagement"
  DB_SSLMODE: "disable"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  ENVIRONMENT: "production"
  PUBLIC_URL: "https://servicedesk.example.com"
  CORS_ALLOWED_ORIGINS: "https://servicedesk.example.com"
  SMTP_PORT: "587"
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: task-management
type: Opaque
stringData:
  DB_PASSWORD: "postgres"
  # Replace every value below before deploying (e.g. via sealed-secrets or your vault).
  JWT_SECRET: "CHANGE-ME-use-a-64-char-random-string"
  REDIS_PASSWORD: ""
  SUPER_ADMIN_EMAIL: "admin@taskflow.com"
  SUPER_ADMIN_PASSWORD: "CHANGE-ME"
  SMTP_HOST: ""
  SMTP_USER: ""
  SMTP_PASS: ""
  SMTP_FROM: ""
