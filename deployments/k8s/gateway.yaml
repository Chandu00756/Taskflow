apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: task-management
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
      - name: gateway
        image: task-management/gateway:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: HTTP_PORT
          value: "8080"
        - name: USER_SERVICE_ADDR
          value: "user-service:50051"
        - name: TASK_SERVICE_ADDR
          value: "task-service:50052"
        - name: NOTIFICATION_SERVICE_ADDR
          value: "notification-service:50053"
        - name: ORG_SERVICE_ADDR
          value: "org-service:50054"
        - name: ITSM_SERVICE_URL
          value: "http://itsm-service:8090"
        - name: TRUST_PROXY_HEADERS
          value: "true"
        envFrom:
        - configMapRef:
            name: app-config
        - secretRef:
            name: app-secrets
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: task-management
spec:
  selector:
    app: gateway
  ports:
  - port: 80
    targetPort: 8080
    name: http
  type: LoadBalancer
