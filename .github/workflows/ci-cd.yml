name: CI/CD Pipeline - TaskFlow Service Desk

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - develop

env:
  GO_VERSION: '1.24'
  NODE_VERSION: '20'
  DOCKER_REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  # Job 1: Go services — vet, lint, unit tests
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Check formatting
        run: test -z "$(gofmt -l services gateway pkg)"

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

      - name: Run tests
        run: go test -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.txt
          flags: unittests

  # Job 2: Frontend — type check, lint, production build
  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - run: npm run build

  # Job 3: Build and push container images
  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push'
    strategy:
      matrix:
        include:
          - service: user-service
            dockerfile: deployments/docker/Dockerfile.user
            context: .
          - service: task-service
            dockerfile: deployments/docker/Dockerfile.task
            context: .
          - service: notification-service
            dockerfile: deployments/docker/Dockerfile.notification
            context: .
          - service: org-service
            dockerfile: deployments/docker/Dockerfile.org
            context: .
          - service: itsm-service
            dockerfile: deployments/docker/Dockerfile.itsm
            context: .
          - service: gateway
            dockerfile: deployments/docker/Dockerfile.gateway
            context: .
          - service: web
            dockerfile: frontend/Dockerfile
            context: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.PUBLIC_API_URL || 'http://localhost:8080' }}

  # Job 4: Image vulnerability scanning
  security:
    name: Scan ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    strategy:
      matrix:
        service: [user-service, task-service, notification-service, org-service, itsm-service, gateway, web]
    permissions:
      security-events: write
    steps:
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results-${{ matrix.service }}.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results-${{ matrix.service }}.sarif'
          category: 'trivy-${{ matrix.service }}'

  # Job 5: Deploy to staging (develop branch)
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop'
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    env:
      NAMESPACE: task-management-staging
      TAG: ${{ github.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubectl
        run: |
          echo "${{ secrets.KUBECONFIG_STAGING }}" | base64 -d > "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"

      - name: Roll out images
        run: |
          for svc in user-service task-service notification-service org-service itsm-service gateway; do
            kubectl set image deployment/$svc $svc=${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_PREFIX }}/$svc:$TAG -n "$NAMESPACE"
          done
          for svc in user-service task-service notification-service org-service itsm-service gateway; do
            kubectl rollout status deployment/$svc -n "$NAMESPACE" --timeout=5m
          done

      - name: Run end-to-end smoke test
        run: python3 scripts/itsm_smoke_test.py --base "${{ vars.STAGING_API_URL }}"

  # Job 6: Deploy to production (version tags)
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build, security]
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    env:
      NAMESPACE: task-management
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubectl
        run: |
          echo "${{ secrets.KUBECONFIG_PRODUCTION }}" | base64 -d > "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"

      - name: Rolling update
        run: |
          for svc in user-service task-service notification-service org-service itsm-service gateway; do
            kubectl set image deployment/$svc $svc=${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_PREFIX }}/$svc:${{ steps.version.outputs.VERSION }} -n "$NAMESPACE"
          done
          for svc in user-service task-service notification-service org-service itsm-service gateway; do
            kubectl rollout status deployment/$svc -n "$NAMESPACE" --timeout=10m || { kubectl rollout undo deployment/$svc -n "$NAMESPACE"; exit 1; }
          done
